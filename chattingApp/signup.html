<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Linking You</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="top-nav">

        <div class="logo">
            Linking You
        </div>

        <div class="nav-links">

            <a href="login.html">
                Login
            </a>

            <a href="signup.html" class="active">
                Sign Up
            </a>

        </div>

    </nav>


    <main class="auth-container">

        <div class="auth-card signup-card">

            <div class="auth-header">

                <div class="auth-logo">
                    LY
                </div>

                <h1>Create Account</h1>

                <p>
                    Join Linking You today
                </p>

            </div>


            <form id="signupForm">

                <div class="form-row">

                    <div class="form-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            placeholder="First name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="lastName">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            placeholder="Last name"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="userType">
                        Account Type
                    </label>

                    <select id="userType" required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="job-seeker">
                            Job Seeker
                        </option>

                        <option value="company">
                            Company
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('signupPassword')">
                            👁
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirmPassword')">
                            👁
                        </button>

                    </div>

                </div>


                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the Terms and Conditions
                    </span>

                </label>


                <button
                    type="submit"
                    class="auth-button">
                    Create Account
                </button>


                <div
                    id="signupMessage"
                    class="message">
                </div>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Linking You. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
