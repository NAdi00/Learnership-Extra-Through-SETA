<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Linking You</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="top-nav">
        <div class="logo">Linking You</div>

        <div class="nav-links">
            <a href="login.html" class="active">Login</a>
            <a href="signup.html">Sign Up</a>
        </div>
    </nav>


    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-header">
                <div class="auth-logo">LY</div>

                <h1>Welcome Back</h1>

                <p>
                    Login to your Linking You account
                </p>
            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('password')">
                            👁
                        </button>

                    </div>

                </div>


                <div class="form-options">

                    <label class="remember">
                        <input
                            type="checkbox"
                            id="rememberMe">
                        Remember me
                    </label>

                    <a href="#" onclick="forgotPassword()">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-button">
                    Login
                </button>


                <div
                    id="loginMessage"
                    class="message">
                </div>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="signup.html">
                        Create an account
                    </a>
                </p>

            </div>

        </div>

    </main>


    <footer>
        <p>
            © 2026 Linking You. All Rights Reserved.
        </p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
